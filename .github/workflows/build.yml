name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      App_Name: MiBand-Heartrate

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore MiBand-Heartrate.slnx

    - name: Build
      run: dotnet build MiBand-Heartrate.slnx --configuration ${{ matrix.configuration }} --no-restore

    - name: Publish GUI
      run: |
        dotnet publish MiBandHR.Avalonia/MiBandHR.Avalonia.csproj `
          --configuration ${{ matrix.configuration }} `
          --output ${{ github.workspace }}/artifact/${{ env.App_Name }}-${{ matrix.configuration }}/

    - name: Publish CLI
      run: |
        dotnet publish MiBandHR.Cli/MiBandHR.Cli.csproj `
          --configuration ${{ matrix.configuration }} `
          --output ${{ github.workspace }}/artifact/${{ env.App_Name }}-cli-${{ matrix.configuration }}/

    - name: Upload Portable GUI
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.App_Name }}-Portable-${{ matrix.configuration }}
        path: ${{ github.workspace }}/artifact/${{ env.App_Name }}-${{ matrix.configuration }}/

    - name: Upload Portable CLI
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.App_Name }}-cli-Portable-${{ matrix.configuration }}
        path: ${{ github.workspace }}/artifact/${{ env.App_Name }}-cli-${{ matrix.configuration }}/

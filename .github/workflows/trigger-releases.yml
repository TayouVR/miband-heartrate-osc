name: Build Application and Make Release

on:
  push:
    tags:
      - '*'

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml

  create_release:
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV

      - name: Package artifacts
        run: |
          mkdir -p dist
          zip -r -9 "dist/MiBand-Heartrate-GUI-${{ env.VERSION }}.zip" "MiBand-Heartrate-Portable-Release/"
          zip -r -9 "dist/MiBand-Heartrate-CLI-${{ env.VERSION }}.zip" "MiBand-Heartrate-cli-Portable-Release/"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: MiBand Heartrate
          draft: true
          prerelease: false
          files: |
            dist/MiBand-Heartrate-GUI-*.zip
            dist/MiBand-Heartrate-CLI-*.zip
